name: e_season_station
description: "E-Season inspector app: scan season ticket QR codes (online or offline)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  mobile_scanner: ^6.0.0
  dart_jsonwebtoken: ^2.14.0
  shared_preferences: ^2.3.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/background02.jpg
    - assets/images/train_logo.png
